global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8081"]
  - job_name: "notes-service"
    static_configs:
      - targets: ["notes-service:8082"]
  - job_name: "audit-service"
    static_configs:
      - targets: ["audit-service:8083"]
