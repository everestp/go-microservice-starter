version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4319:4319"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  gateway:
    build:
      context: ../../services/gateway
    environment:
      APP_ENV: local
      SERVICE_NAME: gateway
      LOG_LEVEL: INFO
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
      AUTH_GRPC_ADDR: auth-service:9090
      NOTES_GRPC_ADDR: notes-service:9090
      AUDIT_GRPC_ADDR: audit-service:9090
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      - auth-service
      - notes-service
      - audit-service

  auth-service:
    build:
      context: ../../services/auth-service
    environment:
      APP_ENV: local
      SERVICE_NAME: auth-service
      GRPC_ADDR: :9091
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://starter:starter@postgres:5432/auth_db
      NATS_URL: nats://nats:4222
    depends_on:
      - postgres
      - nats

  notes-service:
    build:
      context: ../../services/notes-service
    environment:
      APP_ENV: local
      SERVICE_NAME: notes-service
      GRPC_ADDR: :9092
      HTTP_ADDR: :8082
      DATABASE_URL: postgres://starter:starter@postgres:5432/notes_db
      NATS_URL: nats://nats:4222
    depends_on:
      - postgres
      - nats

  audit-service:
    build:
      context: ../../services/audit-service
    environment:
      APP_ENV: local
      SERVICE_NAME: audit-service
      GRPC_ADDR: :9093
      HTTP_ADDR: :8083
      DATABASE_URL: postgres://starter:starter@postgres:5432/audit_db
      NATS_URL: nats://nats:4222
    depends_on:
      - postgres
      - nats
